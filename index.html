<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pix | Mazzo</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #071a2b;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 420px;
            background: #ffffff;
            border-radius: 22px;
            padding: 35px 28px;
            text-align: center;
            box-shadow: 0 15px 45px rgba(0,0,0,0.25);
        }

        .logo {
            font-size: 38px;
            font-weight: 800;
            letter-spacing: 2px;
            color: #0a3152;
            margin-bottom: 5px;
        }

        .subtitle {
            color: #687582;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .pix-title {
            font-size: 27px;
            font-weight: 700;
            color: #17212b;
            margin-bottom: 10px;
        }

        .description {
            color: #687582;
            font-size: 15px;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        .pix-box {
            background: #f2f5f7;
            border: 1px solid #dfe5e9;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 18px;
        }

        .pix-label {
            display: block;
            color: #687582;
            font-size: 12px;
            margin-bottom: 7px;
        }

        .pix-key {
            font-size: 17px;
            font-weight: 700;
            color: #17212b;
            word-break: break-all;
        }

        button {
            width: 100%;
            border: none;
            border-radius: 12px;
            padding: 16px;
            background: #0a3152;
            color: white;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
        }

        button:active {
            transform: scale(0.98);
        }

        .success {
            display: none;
            margin-top: 16px;
            color: #16803c;
            font-size: 14px;
            font-weight: 600;
        }

        .instruction {
            margin-top: 25px;
            font-size: 13px;
            line-height: 1.5;
            color: #7a858d;
        }

        .footer {
            margin-top: 25px;
            font-size: 11px;
            color: #9aa3aa;
        }
    </style>
</head>

<body>

    <div class="card">

        <div class="logo">MAZZO</div>
        <div class="subtitle">Construtora e Pré-Moldados</div>

        <div class="pix-title">Pagamento via Pix</div>

        <div class="description">
            Utilize a chave Pix abaixo para realizar seu pagamento.
        </div>

        <div class="pix-box">
            <span class="pix-label">CHAVE PIX</span>
            <div class="pix-key" id="pixKey">
                59.342.852/0001-00
            </div>
        </div>

        <button onclick="copiarPix()">
            COPIAR CHAVE PIX
        </button>

        <div class="success" id="success">
            ✓ Chave Pix copiada!
        </div>

        <div class="instruction">
            Depois de copiar, abra o aplicativo do seu banco,
            escolha Pix e cole a chave para realizar o pagamento.
        </div>

        <div class="footer">
            Mazzo Construtora e Pré-Moldados
        </div>

    </div>

    <script>
        function copiarPix() {
            const chave = "59.342.852/0001-00";

            navigator.clipboard.writeText(chave).then(function() {
                document.getElementById("success").style.display = "block";

                setTimeout(function() {
                    document.getElementById("success").style.display = "none";
                }, 3000);
            });
        }
    </script>

</body>
</html>
